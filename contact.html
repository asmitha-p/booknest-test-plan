<!DOCTYPE html><html><head><title>Contact - DemoShop</title><link rel="stylesheet" href="style.css"></head>
<body><h1>Contact Us</h1>
<nav><a id="nav-dashboard" href="dashboard.html">Dashboard</a><a id="nav-products" href="products.html">Products</a>
<a id="nav-contact" href="contact.html">Contact</a></nav>
<div id="success-message" class="success" style="display:none">Thank you! Your message has been sent.</div>
<label>Name <input id="name" type="text"></label><div id="name-error" class="error"></div>
<label>Email <input id="email" type="text"></label><div id="email-error" class="error"></div>
<label>Message <textarea id="message"></textarea></label><div id="message-error" class="error"></div>
<button id="submit-button" type="button">Send</button>
<script>
if (!sessionStorage.getItem('user')) { window.location.href = 'login.html'; }
document.getElementById('submit-button').addEventListener('click', function () {
  var ok = true;
  function check(id, bad, msg) {
    document.getElementById(id + '-error').textContent = bad ? msg : '';
    if (bad) ok = false;
  }
  check('name', !document.getElementById('name').value.trim(), 'Name is required');
  check('email', !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(document.getElementById('email').value.trim()), 'Enter a valid email address');
  check('message', document.getElementById('message').value.trim().length < 10, 'Message must be at least 10 characters');
  document.getElementById('success-message').style.display = ok ? 'block' : 'none';
});
</script></body></html>
